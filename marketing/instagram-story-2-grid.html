<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>IdentitateMD — Story 2: Grid Ministere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #01193F;
      --blue: #3054D9;
      --gold: #F9BD41;
      --pink: #DE1A5B;
      --white: #FFFFFF;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--navy);
    }

    .canvas {
      width: 1080px;
      height: 1920px;
      position: relative;
      background: var(--navy);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Backgrounds ────────────────────────────────────────── */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(48,84,217,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(48,84,217,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 100% 60% at 50% 20%, black 10%, transparent 70%);
    }

    .bg-glow-top {
      position: absolute;
      top: -250px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(ellipse, rgba(48,84,217,0.16) 0%, transparent 65%);
      pointer-events: none;
    }

    .bg-glow-bottom {
      position: absolute;
      bottom: -150px;
      right: -80px;
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(222,26,91,0.06) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ── Accent stripe ──────────────────────────────────────── */
    .accent-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg,
        var(--blue) 0%,
        var(--gold) 40%,
        var(--pink) 70%,
        transparent 100%
      );
      z-index: 2;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      margin-top: 4px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 1px;
    }

    .wordmark-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      color: rgba(255,255,255,0.80);
      letter-spacing: -0.01em;
    }

    .wordmark-dot {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--gold);
    }

    .wordmark-tld {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 500;
      color: rgba(255,255,255,0.38);
    }

    .header-sub {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .counter-pill {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 8px 22px;
      background: rgba(249,189,65,0.08);
      border: 1px solid rgba(249,189,65,0.2);
      border-radius: 100px;
    }

    .pill-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .pill-of {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 500;
      color: rgba(255,255,255,0.28);
      line-height: 1;
    }

    .pill-label {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.02em;
    }

    /* ── Grid section ───────────────────────────────────────── */
    .grid-section {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 24px 48px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 3×4 grid for 12 logos */
    .logo-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
    }

    /* Row 5: 2 empty cells centered + 1 ghost */
    .empty-row {
      flex-shrink: 0;
      height: 120px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    /* Logo cell */
    .cell {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 28px;
    }

    .cell img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.35));
    }

    /* Empty (coming soon) cell */
    .cell--empty {
      background: transparent;
      border: 1.5px dashed rgba(255,255,255,0.09);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }

    .cell--ghost {
      visibility: hidden;
    }

    .soon-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255,255,255,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .soon-label {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.20);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    .footer {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .footer-text {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer-text span {
      color: rgba(249,189,65,0.5);
    }
  </style>
</head>
<body>

<div class="canvas">
  <div class="bg-grid"></div>
  <div class="bg-glow-top"></div>
  <div class="bg-glow-bottom"></div>
  <div class="accent-stripe"></div>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="wordmark">
        <span class="wordmark-name">Identitate</span>
        <span class="wordmark-dot">.</span>
        <span class="wordmark-tld">md</span>
      </div>
      <span class="header-sub">Logo-uri vectoriale oficiale</span>
    </div>
    <div class="counter-pill">
      <span class="pill-number">12</span>
      <span class="pill-of">/ 14</span>
      <span class="pill-label">ministere</span>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-section">
    <div class="logo-grid">
      <!-- Row 1 -->
      <div class="cell"><img src="../website/public/logos/md-mae/horizontal-white.svg" alt="MAE" /></div>
      <div class="cell"><img src="../website/public/logos/md-maia/horizontal/white.svg" alt="MAIA" /></div>
      <div class="cell"><img src="../website/public/logos/md-mc/Horizontal%20White.svg" alt="Ministerul Culturii" /></div>
      <!-- Row 2 -->
      <div class="cell"><img src="../website/public/logos/md-mded/horizontal-white.svg" alt="MDED" /></div>
      <div class="cell"><img src="../website/public/logos/md-energie/horizontal-white.svg" alt="Ministerul Energiei" /></div>
      <div class="cell"><img src="../website/public/logos/md-mec/horizontal-white.svg" alt="MEC" /></div>
      <!-- Row 3 -->
      <div class="cell"><img src="../website/public/logos/md-mf/horizontal-white.svg" alt="Ministerul Finanțelor" /></div>
      <div class="cell"><img src="../website/public/logos/md-midr/horizontal/white.svg" alt="MIDR" /></div>
      <div class="cell"><img src="../website/public/logos/md-mj/Horizontal-alt-white.svg" alt="Ministerul Justiției" /></div>
      <!-- Row 4 -->
      <div class="cell"><img src="../website/public/logos/md-mediu/horizontal-white.svg" alt="Ministerul Mediului" /></div>
      <div class="cell"><img src="../website/public/logos/md-mmps/horizontal-white.svg" alt="MMPS" /></div>
      <div class="cell"><img src="../website/public/logos/md-ms/horizontal-white.svg" alt="Ministerul Sănătății" /></div>
    </div>

    <!-- Row 5: ghost + 2 empty (centered) -->
    <div class="empty-row">
      <div class="cell--ghost"></div>
      <div class="cell--empty">
        <div class="soon-icon">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <circle cx="6.5" cy="6.5" r="5.5" stroke="white" stroke-width="1.5"/>
            <path d="M6.5 4v3.2L8.2 9" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="soon-label">în curând</span>
      </div>
      <div class="cell--empty">
        <div class="soon-icon">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <circle cx="6.5" cy="6.5" r="5.5" stroke="white" stroke-width="1.5"/>
            <path d="M6.5 4v3.2L8.2 9" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="soon-label">în curând</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-text">identitate<span>.</span>md</span>
  </div>

</div>

<!--
  Dimensions: 1080 × 1920 px (Instagram Stories 9:16)
  Export: right-click .canvas → "Capture node screenshot"
-->
</body>
</html>
