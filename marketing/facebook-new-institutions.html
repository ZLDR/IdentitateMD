<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>IdentitateMD — Instituții noi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:  #01193F;
      --blue:  #3054D9;
      --gold:  #F9BD41;
      --pink:  #DE1A5B;
      --white: #FFFFFF;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--navy);
    }

    .canvas {
      width: 1200px;
      height: 630px;
      position: relative;
      background: var(--navy);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ── Backgrounds ────────────────────────────────────────── */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(48,84,217,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(48,84,217,0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 30%, transparent 80%);
    }

    .bg-glow-left {
      position: absolute;
      top: -80px;
      left: -120px;
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(48,84,217,0.18) 0%, transparent 65%);
      pointer-events: none;
    }

    .bg-glow-right {
      position: absolute;
      bottom: -80px;
      right: -60px;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(249,189,65,0.06) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ── Accent stripe ──────────────────────────────────────── */
    .accent-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg,
        var(--blue) 0%,
        var(--gold) 40%,
        var(--pink) 70%,
        transparent 100%
      );
    }

    /* ── Header bar ─────────────────────────────────────────── */
    .header {
      position: absolute;
      top: 3px;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 44px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 1px;
      flex-shrink: 0;
    }

    .wordmark-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      letter-spacing: -0.01em;
    }

    .wordmark-dot {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
    }

    .wordmark-tld {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
    }

    .sep {
      width: 1px;
      height: 32px;
      background: rgba(255,255,255,0.12);
      margin: 0 36px;
      flex-shrink: 0;
    }

    .badge-new {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .badge-new-pill {
      background: var(--gold);
      color: var(--navy);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 100px;
    }

    .badge-new-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--white);
      letter-spacing: -0.01em;
    }

    .badge-new-sub {
      font-size: 12.5px;
      font-weight: 400;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.02em;
      margin-left: 4px;
    }

    .url-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .url-badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue);
      flex-shrink: 0;
    }

    /* ── Institution cards ──────────────────────────────────── */
    .cards {
      position: absolute;
      top: 67px;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 24px 44px 32px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 28px 24px 24px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }

    .card-logo {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .card-logo img {
      max-width: 100%;
      max-height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.4));
    }

    .card-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .card-name {
      font-size: 13.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.82);
      text-align: center;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .card-slug {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.06em;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="canvas">
  <div class="bg-grid"></div>
  <div class="bg-glow-left"></div>
  <div class="bg-glow-right"></div>
  <div class="accent-stripe"></div>

  <!-- Header -->
  <div class="header">
    <div class="wordmark">
      <span class="wordmark-name">Identitate</span>
      <span class="wordmark-dot">.</span>
      <span class="wordmark-tld">md</span>
    </div>

    <div class="sep"></div>

    <div class="badge-new">
      <span class="badge-new-pill">Nou</span>
      <span class="badge-new-text">3 instituții adăugate</span>
      <span class="badge-new-sub">· logo-uri vectoriale oficiale</span>
    </div>

    <div class="url-badge">
      <div class="url-badge-dot"></div>
      identitate.md
    </div>
  </div>

  <!-- Cards -->
  <div class="cards" id="js-cards">

    <div class="card">
      <div class="card-logo">
        <img src="../website/public/logos/md-ca/symbol-color.svg" alt="Consiliul Audiovizualului" style="width: 65%; max-height: 200px;" />
      </div>
      <div class="card-info">
        <div class="card-name">Consiliul Audiovizualului</div>
        <div class="card-slug">md-ca</div>
      </div>
    </div>

    <div class="card">
      <div class="card-logo">
        <img src="../website/public/logos/md-stema/stema-color.svg" alt="Stema Republicii Moldova" />
      </div>
      <div class="card-info">
        <div class="card-name">Stema Republicii Moldova</div>
        <div class="card-slug">md-stema</div>
      </div>
    </div>

    <div class="card">
      <div class="card-logo">
        <img src="../website/public/logos/md-steag/horizontal-color.svg" alt="Steagul Republicii Moldova" />
      </div>
      <div class="card-info">
        <div class="card-name">Steagul Republicii Moldova</div>
        <div class="card-slug">md-steag</div>
      </div>
    </div>

  </div>

</div>

-->

</body>
</html>
