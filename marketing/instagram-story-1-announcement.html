<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>IdentitateMD — Story 1: Anunț 12/14</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #01193F;
      --blue: #3054D9;
      --gold: #F9BD41;
      --pink: #DE1A5B;
      --white: #FFFFFF;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--navy);
    }

    .canvas {
      width: 1080px;
      height: 1920px;
      position: relative;
      background: var(--navy);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ── Backgrounds ────────────────────────────────────────── */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(48,84,217,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(48,84,217,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 120% 100% at 50% 45%, black 15%, transparent 70%);
    }

    .bg-glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1400px;
      height: 1400px;
      background: radial-gradient(ellipse, rgba(48,84,217,0.22) 0%, transparent 60%);
      pointer-events: none;
    }

    .bg-glow-gold {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(ellipse, rgba(249,189,65,0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Accent stripe ──────────────────────────────────────── */
    .accent-stripe {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--blue) 0%, var(--gold) 40%, var(--pink) 70%, transparent 100%);
    }

    /* ── Wordmark — top left ─────────────────────────────────── */
    .wordmark {
      position: absolute;
      top: 100px;
      left: 68px;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .wordmark-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 600;
      color: rgba(255,255,255,0.80);
      letter-spacing: -0.01em;
    }

    .wordmark-dot {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 700;
      color: var(--gold);
    }

    .wordmark-tld {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
    }

    /* ── Badge — top right ──────────────────────────────────── */
    .badge {
      position: absolute;
      top: 112px;
      right: 68px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 100px;
      font-size: 22px;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.65;
    }

    /* ── Main content block — visually centered ─────────────── */
    /* top: 380px puts it just below the wordmark area with breathing room */
    .main-block {
      position: absolute;
      top: 380px;
      left: 68px;
      right: 68px;
    }

    .overline {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-bottom: 32px;
    }

    .number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 480px;
      font-weight: 700;
      color: var(--gold);
      line-height: 0.82;
      letter-spacing: -0.06em;
      margin-left: -14px; /* optical alignment */
    }

    .rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.18) 0%, transparent 65%);
      margin: 56px 0;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .label-of {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 500;
      color: rgba(255,255,255,0.22);
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .label-sep {
      width: 2px;
      height: 76px;
      background: rgba(255,255,255,0.12);
      flex-shrink: 0;
    }

    .label-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label-main {
      font-family: 'Cormorant Garamond', serif;
      font-size: 108px;
      font-weight: 600;
      color: rgba(255,255,255,0.78);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .label-sub {
      font-size: 30px;
      font-weight: 400;
      color: rgba(255,255,255,0.36);
      letter-spacing: 0.01em;
    }

    /* ── Bottom block ───────────────────────────────────────── */
    /* Instagram safe zone bottom: keep above ~250px from bottom */
    .bottom-block {
      position: absolute;
      bottom: 180px;
      left: 68px;
      right: 68px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .desc {
      font-size: 34px;
      font-weight: 400;
      color: rgba(255,255,255,0.40);
      line-height: 1.55;
    }

    .desc strong {
      color: rgba(255,255,255,0.68);
      font-weight: 500;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .swipe-hint {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 24px;
      font-weight: 400;
      color: rgba(255,255,255,0.24);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .url-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 30px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 100px;
      font-size: 26px;
      font-weight: 400;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.03em;
    }

    .url-chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.45;
    }
  </style>
</head>
<body>

<div class="canvas">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow-gold"></div>
  <div class="accent-stripe"></div>

  <!-- Top: wordmark + badge -->
  <div class="wordmark">
    <span class="wordmark-name">Identitate</span>
    <span class="wordmark-dot">.</span>
    <span class="wordmark-tld">md</span>
  </div>
  <div class="badge">
    <div class="badge-dot"></div>
    Ministere
  </div>

  <!-- Main content -->
  <div class="main-block">
    <div class="overline">Identitate vizuală oficială</div>
    <div class="number">12</div>
    <div class="rule"></div>
    <div class="label-row">
      <span class="label-of">din 14</span>
      <div class="label-sep"></div>
      <div class="label-right">
        <span class="label-main">Ministere</span>
        <span class="label-sub">cu identitate vizuală pe platformă</span>
      </div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom-block">
    <p class="desc">
      Logo-uri vectoriale oficiale, <strong>palete de culori</strong> și
      tipografie — disponibile gratuit pe Identitate.md.
    </p>
    <div class="bottom-row">
      <div class="swipe-hint">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M5 14h18M18 8l6 6-6 6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
        </svg>
        Vezi toate logo-urile
      </div>
      <div class="url-chip">
        <div class="url-chip-dot"></div>
        identitate.md
      </div>
    </div>
  </div>

</div>

<!--
  Dimensions: 1080 × 1920 px (Instagram Stories 9:16)
  Instagram safe zones: avoid top 250px and bottom 250px for critical content
  Export: right-click .canvas → "Capture node screenshot"
-->
</body>
</html>
