<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>IdentitateMD — Anunț Instituție Nouă</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ─── CONFIG — edit these per announcement ─────────────────────── */
    :root {
      --institution-name:     "Ministerul Muncii și\AProtecției Sociale";
      --institution-shortname:"MMPS";
      --institution-category: "Minister";
      --logo-path:            "../website/public/logos/md-mmps/horizontal-alt-white.svg";
      --logo-alt-path:        "../website/public/logos/md-mmps/vertical-white.svg";
      --institution-url:      "social.gov.md";

      /* Platform palette */
      --navy:   #01193F;
      --blue:   #3054D9;
      --gold:   #F9BD41;
      --pink:   #DE1A5B;
      --white:  #FFFFFF;
      --mist:   rgba(255,255,255,0.06);
    }
    /* ──────────────────────────────────────────────────────────────── */

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--navy);
    }

    .canvas {
      width: 1200px;
      height: 630px;
      position: relative;
      background: var(--navy);
      display: flex;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ── Atmospheric background ──────────────────────────────────── */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(48,84,217,0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(48,84,217,0.10) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 30% 50%, black 20%, transparent 80%);
    }

    .bg-glow {
      position: absolute;
      top: -120px;
      left: -80px;
      width: 700px;
      height: 700px;
      background: radial-gradient(ellipse, rgba(48,84,217,0.22) 0%, transparent 65%);
      pointer-events: none;
    }

    .bg-glow-gold {
      position: absolute;
      bottom: -100px;
      right: 320px;
      width: 400px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(249,189,65,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Left column — logo zone ───────────────────────────────── */
    .col-logo {
      position: relative;
      width: 580px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 56px 64px 56px;
    }

    .logo-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
    }

    .institution-logo {
      width: 100%;
      max-width: 340px;
      height: auto;
      max-height: 280px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 40px rgba(0,0,0,0.5));
    }

    /* Subtle category chip under logo */
    .category-chip {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 10px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .category-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* ── Divider ──────────────────────────────────────────────── */
    .divider {
      position: absolute;
      left: 580px;
      top: 0;
      width: 1px;
      height: 630px;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255,255,255,0.12) 20%,
        rgba(255,255,255,0.12) 80%,
        transparent 100%
      );
    }

    /* ── Right column — text zone ──────────────────────────────── */
    .col-text {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 72px 64px 80px;
    }

    /* "NOU" badge */
    .badge-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .badge-nou {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gold);
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 4px;
    }

    .badge-label {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.03em;
    }

    /* Main heading */
    .heading-block {
      display: flex;
      flex-direction: column;
    }

    .overline {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 14px;
    }

    .institution-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 600;
      line-height: 1.18;
      color: var(--white);
      letter-spacing: -0.01em;
    }

    .institution-name em {
      font-style: italic;
      color: rgba(255,255,255,0.72);
    }

    .tagline {
      margin-top: 24px;
      font-size: 14.5px;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      line-height: 1.55;
      max-width: 340px;
    }

    .tagline strong {
      color: rgba(255,255,255,0.85);
      font-weight: 500;
    }

    /* ── Accent stripe ──────────────────────────────────────────── */
    .accent-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg,
        var(--blue) 0%,
        var(--gold) 40%,
        var(--pink) 70%,
        transparent 100%
      );
    }

    /* ── Shortname watermark ────────────────────────────────────── */
    .shortname-watermark {
      position: absolute;
      right: -8px;
      bottom: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 180px;
      font-weight: 700;
      color: rgba(255,255,255,0.025);
      letter-spacing: -0.05em;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

<div class="canvas">
  <!-- Backgrounds -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow-gold"></div>

  <!-- Accent top stripe -->
  <div class="accent-stripe"></div>

  <!-- Shortname watermark -->
  <div class="shortname-watermark" id="js-watermark">MDED</div>

  <!-- Left column: logo -->
  <div class="col-logo">
    <div class="logo-lockup">
      <img
        id="js-logo"
        class="institution-logo"
        src="../website/public/logos/md-mded/vertical-white.svg"
        alt="Logo MDED"
      />
    </div>
  </div>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Right column: text -->
  <div class="col-text">

    <!-- Heading block -->
    <div class="heading-block">
      <div class="overline">Logo-urile în format vectorial</div>
      <div class="institution-name" id="js-name">
        Ministerul Dezvoltării<br/>
        Economice și<br/>
        <em>Digitalizării</em>
      </div>
      <p class="tagline" id="js-tagline">
        Logo-urile oficiale și stilurile <strong id="js-tagline-strong">MDED</strong> sunt acum disponibile pe platforma Identitate.md.
      </p>
    </div>

  </div><!-- /col-text -->

</div><!-- /canvas -->

<!--
  ═══════════════════════════════════════════════════════════════
  HOW TO USE THIS TEMPLATE
  ═══════════════════════════════════════════════════════════════

  To generate a post for a different institution, change the
  values in the JS config block below:

  institution.logoSrc   → path to white logo SVG
  institution.name      → HTML for the institution name (use <br/> for line breaks, <em> for italic)
  institution.shortname → abbreviation (used in watermark + tagline)
  institution.category  → category label shown under logo
  institution.slug      → URL slug on identitate.md
  institution.tagline   → description sentence (can leave as null for auto-generated)

  To export as an image:
  1. Open in Chrome (file://)
  2. Open DevTools → Run in console: window.scrollTo(0,0)
  3. Right-click the .canvas element → "Capture node screenshot"
     OR use the /gstack skill to screenshot it:
       /gstack screenshot file://./marketing/facebook-announcement.html --width=1200 --height=630

  Dimensions: 1200 × 630 px (Facebook/LinkedIn recommended ratio)
  ═══════════════════════════════════════════════════════════════
-->

<script>
  const institution = {
    logoSrc:   "../website/public/logos/md-ca/symbol-white.svg",
    name:      "Consiliul Audiovizualului",
    shortname: "CA",
    category:  "Consiliu",
    slug:      "consiliul-audiovizualului",
    tagline:   null, // null = auto-generated
  };

  // ── Apply config ──────────────────────────────────────────────
  document.getElementById("js-logo").src        = institution.logoSrc;
  document.getElementById("js-logo").alt        = `Logo ${institution.shortname}`;
  document.getElementById("js-name").innerHTML  = institution.name;
  const catEl = document.getElementById("js-category");
  if (catEl) catEl.textContent = institution.category;
  document.getElementById("js-watermark").textContent = institution.shortname;
  document.getElementById("js-tagline-strong").textContent = institution.shortname;

  if (institution.tagline) {
    document.getElementById("js-tagline").innerHTML = institution.tagline;
  } else {
    document.getElementById("js-tagline").innerHTML =
      `Logo-urile oficiale și stilurile ` +
      `<strong id="js-tagline-strong">${institution.shortname}</strong> ` +
      `sunt acum disponibile pe platforma Identitate.md.`;
  }
</script>

</body>
</html>
